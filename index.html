<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Recommended Items - Spike Shop</title>


    <style>

	h1 {		
		text-align: center;
		margin: 0;
		padding: 40px;
		color: #333;
	} 

	h2 {		
		text-align: center;
		margin: 0;
		padding: 40px;
		color: #333;
		font-size: 18px;
	} 
	
	img {		
		img-align: center;
		margin: auto;
		padding: 40px;
		color: #333;
		display: flex;
		justify: center;
		align: center;
	} 


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }


        /* Header */

        header {
            background: linear-gradient(
                135deg,
                #111827,
                #2563eb
            );

            color: white;

            padding: 20px 7%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        .logo {
            font-size: 25px;
            font-weight: bold;
        }


        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-weight: bold;
        }


        nav a:hover {
            color: #93c5fd;
        }


        /* Page Title */

        .page-title {
            text-align: center;
            padding: 60px 20px 30px;
        }


        .page-title h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }


        .page-title p {
            color: #666;
            font-size: 17px;
        }


        /* Back Button */

        .back-container {
            text-align: center;
            margin-bottom: 35px;
        }


        .back-button {
            display: inline-block;

            padding: 10px 22px;

            background: #111827;
            color: white;

            text-decoration: none;

            border-radius: 25px;

            font-weight: bold;
        }


        .back-button:hover {
            background: #2563eb;
        }


        /* Items */

        .items {

            width: 86%;
            max-width: 1200px;

            margin: auto;

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));

            gap: 25px;

            padding-bottom: 70px;
        }


        /* Item Card */

        .item-card {

            background: white;

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.08);

            transition: 0.3s;
        }


        .item-card:hover {

            transform: translateY(-8px);

            box-shadow:
                0 15px 35px rgba(0,0,0,0.15);
        }


        /* Image */

        .item-image {

            width: 100%;
            height: 300px;

            background: #222;

            display: flex;

            justify-content: center;
            align-items: center;

            overflow: hidden;
        }


        .item-image img {

            width: 100%;
            height: 100%;

            object-fit: cover;
        }


        /* Information */

        .item-info {

            padding: 20px;
        }


        .recommended-label {

            display: inline-block;

            padding: 6px 12px;

            margin-bottom: 10px;

            border-radius: 20px;

            background: #fff3cd;

            color: #d97706;

            font-size: 12px;

            font-weight: bold;
        }


        .item-info h2 {

            font-size: 23px;

            margin-bottom: 10px;
        }


        .description {

            color: #777;

            line-height: 1.6;

            font-size: 14px;
        }


        /* Price */

        .price {

            margin-top: 18px;

            font-size: 22px;

            font-weight: bold;

            color: #2563eb;
        }


        /* Footer */

        footer {

            background: #111827;

            color: #aaa;

            text-align: center;

            padding: 30px;
        }


        footer strong {
            color: white;
        }


        /* Mobile */

        @media (max-width: 600px) {

            nav {
                display: none;
            }

            .page-title h1 {
                font-size: 34px;
            }

            .item-image {
                height: 260px;
            }
        }

    </style>

</head>


<body>


    <!-- Header -->

    <header>

        <div class="logo">
            🏐 TSC MYANMAR
        </div>

        <nav>

		<a href="recommended.html">Recommended</a>
		<a href="weakly & monthly.html">Weakly & Monthly</a>
		<a href="basic.html">Basic</a>
		<a href="colosseum.html">Colosseum</a>		

        </nav>

    </header>

	<div class="image-info">
		<img
			src="images/logo.jpg" Alt="Logo">
	<h1>Welcome to TSC MYANMAR</h1>
	<h2>Thanks for come and watching our website<br>Click the bar above and watch the prices</h2>
	


     <!-- Footer -->

    <footer>

        <p>
            <strong>THE SPIKE CROSS ITEMS<br>@hyouma</strong>
        </p>

        </footer>


</body>

</html>
