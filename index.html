<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <!-- Important for Android and iPhone -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <meta name="theme-color" content="#111827">

    <title>TSC MYANMAR - The Spike Cross</title>


    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            width: 100%;
            overflow-x: hidden;
        }


        body {
            width: 100%;
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f7fb;

            color: #222;

            overflow-x: hidden;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            width: 100%;

            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #2563eb
                );

            color: white;

            padding: 18px 5%;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.15);
        }


        .logo {
            font-size: 24px;

            font-weight: bold;

            white-space: nowrap;
        }


        /* =========================
           NAVIGATION
        ========================= */

        nav {
            display: flex;

            align-items: center;

            gap: 10px;

            flex-wrap: wrap;

            justify-content: center;
        }


        nav a {
            color: white;

            text-decoration: none;

            font-weight: bold;

            font-size: 14px;

            padding: 10px 12px;

            border-radius: 10px;

            transition: 0.3s;
        }


        nav a:hover {
            background: rgba(255,255,255,0.15);

            color: #bfdbfe;
        }


        /* =========================
           MAIN
        ========================= */

        main {
            width: 100%;
        }


        .image-info {
            width: 100%;

            max-width: 1000px;

            margin: auto;

            text-align: center;

            padding:
                60px 20px 80px;
        }


        /* =========================
           LOGO
        ========================= */

        .image-info img {
            display: block;

            width: 220px;

            height: 220px;

            max-width: 80vw;

            object-fit: cover;

            margin:
                0 auto 35px;

            border-radius: 50%;

            padding: 8px;

            background: white;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.15);

            transition: 0.3s;
        }


        .image-info img:hover {
            transform: scale(1.05);
        }


        /* =========================
           TITLE
        ========================= */

        .image-info h1 {
            font-size: 42px;

            line-height: 1.2;

            color: #111827;

            margin-bottom: 18px;
        }


        /* =========================
           DESCRIPTION
        ========================= */

        .image-info h2 {
            font-size: 18px;

            font-weight: normal;

            line-height: 1.8;

            color: #666;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            width: 100%;

            background: #111827;

            color: #aaa;

            text-align: center;

            padding: 30px 20px;

            margin-top: 20px;
        }


        footer strong {
            color: white;

            line-height: 1.8;
        }


        /* ==================================================
           ANDROID / iPHONE
        ================================================== */

        @media screen and (max-width: 768px) {

            header {
                flex-direction: column;

                padding:
                    18px 12px;

                gap: 12px;
            }


            .logo {
                font-size: 22px;

                text-align: center;
            }


            nav {
                width: 100%;

                display: grid;

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 8px;
            }


            nav a {
                width: 100%;

                text-align: center;

                background:
                    rgba(255,255,255,0.10);

                padding: 12px 5px;

                font-size: 13px;

                border-radius: 10px;

                /* Makes tapping easier */
                min-height: 44px;

                display: flex;

                align-items: center;

                justify-content: center;
            }


            .image-info {
                padding:
                    45px 18px 60px;
            }


            .image-info img {
                width: 180px;

                height: 180px;

                margin-bottom: 28px;
            }


            .image-info h1 {
                font-size: 32px;

                line-height: 1.25;
            }


            .image-info h2 {
                font-size: 15px;

                line-height: 1.7;
            }

        }


        /* ==================================================
           SMALL PHONES
           iPhone SE / Small Android
        ================================================== */

        @media screen and (max-width: 400px) {

            .logo {
                font-size: 19px;
            }


            nav {
                grid-template-columns:
                    1fr 1fr;
            }


            nav a {
                font-size: 12px;

                padding: 10px 3px;
            }


            .image-info {
                padding:
                    35px 15px 50px;
            }


            .image-info img {
                width: 150px;

                height: 150px;
            }


            .image-info h1 {
                font-size: 27px;
            }


            .image-info h2 {
                font-size: 14px;
            }


            footer {
                font-size: 13px;

                padding: 25px 15px;
            }

        }


        /* ==================================================
           TABLET
        ================================================== */

        @media screen and
               (min-width: 769px) and
               (max-width: 1100px) {

            header {
                padding:
                    18px 3%;
            }


            nav a {
                font-size: 13px;
            }


            .image-info h1 {
                font-size: 38px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <div class="logo">
            🏐 TSC MYANMAR
        </div>


        <nav>

            <a href="recommended.html">
                Recommended
            </a>

            <a href="weakly & monthly.html">
                Weekly & Monthly
            </a>

            <a href="basic.html">
                Basic
            </a>

            <a href="colosseum.html">
                Colosseum
            </a>

        </nav>

    </header>



    <!-- =========================
         MAIN
    ========================= -->

    <main>

        <section class="image-info">

            <img
                src="Logo.jpg"
                alt="TSC Myanmar Logo"
            >


            <h1>
                Welcome to TSC MYANMAR
            </h1>


            <h2>
                Thanks for coming and watching our website.<br>
                Click the buttons above and check the prices.
            </h2>

        </section>

    </main>



    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        <p>
            <strong>
                THE SPIKE CROSS ITEMS<br>
                @hyouma
            </strong>
        </p>

    </footer>


</body>
</html>
